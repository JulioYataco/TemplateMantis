<p-toast></p-toast>

<div class="login-container p-jc-left p-ai-left">
  <div class="login-card p-shadow-8">
    <div class="smoke smoke-1"></div>
    <div class="smoke smoke-2"></div>
    <div class="smoke smoke-3"></div>
    <div class="login-header p-text-center">
      <img src="assets/images/beta/logoautobet-azul-s.png" alt="Logo" class="logo" style="display: block; margin: auto; width: 50%; height: auto;"/>
      <!--<h1>Inicio de Sesión</h1>-->
      <p>¡Bienvenido! Por favor, ingresa tus credenciales.</p>
    </div>
    <form (ngSubmit)="login()" class="p-fluid">
      <div class="p-field">
        <label class="form-label" for="username">Usuario</label>
        <p-iconfield>
          <input autofocus [(ngModel)]="username" name="username" type="text" class="form-control large-input" id="username" placeholder="Ingresa tu usuario" required />
          <p-inputicon class="pi pi-user" />
        </p-iconfield>
      </div>
      <div class="p-field">
        <label class="form-label" for="password">Contraseña</label>
        <p-iconfield>
          <input  [(ngModel)]="password" name="password" type="password" class="form-control large-input" id="password" placeholder="Digite la clave" required />
          <p-inputicon class="pi pi-lock" />
        </p-iconfield>
      </div>
      <button 
        *ngIf="!isLoading"
        pButton 
        type="submit" 
        label="Iniciar sesión"
        class="p-button-rounded p-button-lg">
      </button>
      <div *ngIf="isLoading" class="spinner-container">
        <div class="moto-spinner">
          <div class="wheel"></div>
          <div class="smoke-puff"></div>
          <p>Calentando motor...</p>
        </div>
      </div>
    </form>
  </div>
</div>
