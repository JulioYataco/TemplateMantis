<p-confirmdialog></p-confirmdialog>
<p-toast></p-toast>
<div class="card">
    <p-toolbar styleClass="mb-4">
      <ng-template #start>
        <p-button label="Nuevo" variant="text" severity="info" icon="pi pi-plus" [raised]="true" (click)="mostrarDialogo()" />
      </ng-template>
      <ng-template #end>
        <div class="busqueda-export">
          <input pInputText type="text" class="busqueda-input" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Buscar..." />
        </div>
      </ng-template>
    </p-toolbar>
    
    <!-- Tabla -->                            
    <p-table 
        #dt 
        [value]="cargando ? skeletonData : lista"
        [loading]="cargando" 
        [rows]="5" 
        [paginator]="true" 
        [globalFilterFields]="['id', 'nombre_area', 'sede', 'jefatura', 'full_name', 'first_name']"
        [tableStyle]="{ 'min-width': '75rem' }" 
        [rowsPerPageOptions]="[5, 10, 20]" 
        [rowHover]="true"
        dataKey="id"
        [showCurrentPageReport]="true"
        >

        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="id">ID <p-sortIcon field="id" /></th>
            <th pSortableColumn="nombre_area">Nombre area <p-sortIcon field="nombre_area" /></th>
            <th pSortableColumn="sede">Sede <p-sortIcon field="sede" /></th>
            <th pSortableColumn="jefatura">Jefatura <p-sortIcon field="jefatura" /></th>
            <th >Operaciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-entidad>
          <tr *ngIf="cargando; else mostrarDatos">
            <td><p-skeleton width="4rem" height="1.5rem"></p-skeleton></td>
            <td><p-skeleton width="7rem" height="1.5rem"></p-skeleton></td>
            <td><p-skeleton width="9rem" height="1.5rem"></p-skeleton></td>
            <td><p-skeleton width="8rem" height="1.5rem"></p-skeleton></td>
            <td><p-skeleton width="8rem" height="1.5rem"></p-skeleton></td>
          </tr>
          <ng-template #mostrarDatos>
            <tr>
                <td>{{entidad.id}}</td>
                <td>{{entidad.nombre_area}}</td>
                <td>{{obtenerNombreSede(entidad.sede)}}</td>
                <td>{{obtenerNombrepersona(entidad.jefatura)}}</td>
                <td>
                  <p-button icon="pi pi-pencil" variant="text" severity="warn" class="mr-2" [raised]="true" (click)="CargarDatosModal(entidad)"></p-button>
                  <p-button icon="pi pi-trash" variant="text" severity="danger" [raised]="true" (click)="eliminar(entidad.id)"></p-button>
                </td>
            </tr>
          </ng-template>
        </ng-template>
        <!--<ng-template #summary>
            <div class="flex items-center justify-between">En total hay  {{ entidad ? entidad.length : 0 }} entidad.</div>
        </ng-template> -->
    </p-table>
</div>


<!-- Modal para agregar o editar producto -->
<p-dialog [(visible)]="displayModal" [style]="{  width: '90%', maxWidth: '450px' }" [modal]="true" header="Formulario">
    <ng-template #content>
          <div class="formulario">
            <div>
                <label for="nombre_area" class="block font-bold mb-3">Nombre de area</label>
                <input id="nombre_area" type="text" pInputText [(ngModel)]="entidad.nombre_area" required autofocus fluid />
            </div>
            <div>
              <label for="data" class="block font-bold mb-3">Sede</label>
                <p-dropdown fluid [appendTo]="'body'"
                  [options]="sedes"
                  optionLabel="nombre_sede"
                  optionValue="id"
                  [(ngModel)]="entidad.sede"
                  placeholder="Seleccione una sede">
              </p-dropdown>
            </div>
            <div>
              <label for="data" class="block font-bold mb-3">Jefe</label>
                <p-dropdown fluid [appendTo]="'body'"
                  [options]="perfilDetalles"
                  optionLabel="full_name"
                  optionValue="usuario_id"
                  [(ngModel)]="entidad.jefatura"
                  placeholder="Seleccione un Jefe">
              </p-dropdown>
            </div>
        </div>
    </ng-template>
    <ng-template #footer>
      <p-button label="Cancel" severity="info" icon="pi pi-times" text (click)="cerrarDialogo()" />
      <p-button label="Guardar" severity="info" icon="pi pi-check" (click)="guardar()" />
    </ng-template>
</p-dialog>
