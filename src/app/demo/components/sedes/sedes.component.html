<p-confirmdialog></p-confirmdialog>
<p-toast></p-toast>
<div class="card">
    <p-toolbar styleClass="mb-4">
      <ng-template #start>
        <p-button label="Nuevo" variant="text" severity="info" icon="pi pi-plus" [raised]="true" (click)="mostrarDialogo()" />
      </ng-template>
      <ng-template #end>
        <div class="busqueda-export">
          <input pInputText type="text" class="busqueda-input" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Buscar..." />
        </div>
      </ng-template>
    </p-toolbar>
    
    <!-- Tabla -->                            
    <p-table 
        #dt 
        [value]="cargando ? skeletonData : lista"
        [loading]="cargando" 
        [rows]="5" 
        [paginator]="true" 
        [globalFilterFields]="['id', 'uigeo', 'nombre_sede', 'direccion']"
        [style.width.%]="100" 
        [rowsPerPageOptions]="[5, 10, 20]" 
        [rowHover]="true"
        dataKey="id"
        [showCurrentPageReport]="true"
        >

        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="id">Id <p-sortIcon field="id" /></th>
            <th pSortableColumn="ubigeo">Ubigeo <p-sortIcon field="ubigeo" /></th>
            <th pSortableColumn="nombre_sede">Nombre de sede <p-sortIcon field="nombre_sede" /></th>
            <th pSortableColumn="direccion">Dirección <p-sortIcon field="direccion" /></th>
            <th >Operaciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-entidad>
          <tr *ngIf="cargando; else mostrarDatos">
            <td><p-skeleton width="7rem" height="1.5rem"></p-skeleton></td>
            <td><p-skeleton width="9rem" height="1.5rem"></p-skeleton></td>
            <td><p-skeleton width="8rem" height="1.5rem"></p-skeleton></td>
            <td><p-skeleton width="8rem" height="1.5rem"></p-skeleton></td>
            <td><p-skeleton width="5rem" height="1.5rem"></p-skeleton></td>
          </tr>
          <ng-template #mostrarDatos>
            <tr>
                <td>{{entidad.id}}</td>
                <td>{{obtenerNombreUbigeo(entidad.ubigeo)}}</td>
                <td>{{entidad.nombre_sede}}</td>
                <td>{{entidad.direccion}}</td>
                <td>
                  <p-button icon="pi pi-pencil" variant="text" severity="warn" class="mr-2" [raised]="true" (click)="CargarDatosModal(entidad)"></p-button>
                  <p-button icon="pi pi-trash" variant="text" severity="danger" [raised]="true" (click)="eliminar(entidad.id)"></p-button>
                </td>
            </tr>
          </ng-template>
        </ng-template>
        <!--<ng-template #summary>
            <div class="flex items-center justify-between">En total hay  {{ entidad ? entidad.length : 0 }} entidad.</div>
        </ng-template> -->
    </p-table>
</div>


<!-- Modal para agregar o editar producto -->
<p-dialog [(visible)]="displayModal" [style]="{ width: '90%', maxWidth: '450px' }" [modal]="true" header="Formulario">
    <ng-template #content>
        <div class="formulario">
            <div>
                <label for="ubigeo" class="block font-bold mb-3">Ubigeo</label>
                <!--1. usa la lista de lotes obtenidas en el component. 2.Muestra el valor extreno para el usuario en este caso nombre de lote. 3. optionValue="id" guarda el id del lote en la entidad 4. ngModel sigue guardando el ID en la entidad-->
                <p-dropdown fluid
                  [options]="ubigeos" 
                  optionLabel="ubigeocompleto" 
                  optionValue="ubigeo" 
                  [loading]="loadingUbigeo"
                  loadingIcon="pi pi-spinner pi-spin"
                  [(ngModel)]="entidad.ubigeo" 
                  placeholder="Seleccione un distrito"
                  [filter]="true"
                  [showClear]="true"
                >
                </p-dropdown>
                <p *ngIf="loadingUbigeo">Cargando ubigeos...</p>
                <!-- Spinner flotante visible siempre mientras carga -->
                <div
                  *ngIf="loadingUbigeo"
                  class="absolute top-2 right-2 z-10 flex items-center"
                >
                  <i class="pi pi-spinner pi-spin text-blue-500 text-xl"></i>
                  <span class="ml-2 text-sm text-gray-500">Cargando ubigeos...</span>
                </div>
            </div>
            <div>
                <label for="nombre_sede" class="block font-bold mb-3">Sede</label>
                <input id="nombre_sede" type="text" pInputText [(ngModel)]="entidad.nombre_sede" fluid/>
            </div>
            <div>
                <label for="direccion" class="block font-bold mb-3">Dirección</label>
                <input id="direccion" type="text" pInputText [(ngModel)]="entidad.direccion" fluid/>
            </div>
        </div>
    </ng-template>
    <ng-template #footer>
      <p-button label="Cancel" icon="pi pi-times" text (click)="cerrarDialogo()" />
      <p-button label="Guardar" icon="pi pi-check" (click)="guardar()" />
    </ng-template>
</p-dialog>
