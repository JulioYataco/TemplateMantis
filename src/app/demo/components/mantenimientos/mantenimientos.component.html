<p-confirmdialog></p-confirmdialog>
<p-toast></p-toast>
<div class="card">    
    <!-- Tabla   -->                     
    <p-table 
        #dt 
        [value]="cargando ? skeletonData : lista"
        [loading]="cargando"
        [rows]="5" 
        [paginator]="true" 
        [globalFilterFields]="['id', 'asignacion_vehiculo','fecha', 'hora', 'completado', 'observacion']"
        [style.width.%]="100"  
        [rowsPerPageOptions]="[5, 10, 20]" 
        [rowHover]="true"
        dataKey="id"
        [showCurrentPageReport]="true"
        emptyMessage="No hay registros disponibles"
        >

        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="id">ID <p-sortIcon field="id" /></th>
            <th pSortableColumn="asignacion_vehiculo">vehiculo <p-sortIcon field="asignacion_vehiculo" /></th>
            <th pSortableColumn="fecha">Fecha <p-sortIcon field="perfil" /></th>
            <th pSortableColumn="completado">Completado <p-sortIcon field="completado" /></th>
            <th pSortableColumn="observacion">observacion <p-sortIcon field="observacion" /></th>
            <th >Operaciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-entidad >
          <tr *ngIf="cargando; else mostrarDatos">
            <td><p-skeleton width="4rem" height="1.5rem"></p-skeleton></td>
            <td><p-skeleton width="7rem" height="1.5rem"></p-skeleton></td>
            <td><p-skeleton width="9rem" height="1.5rem"></p-skeleton></td>
            <td><p-skeleton width="8rem" height="1.5rem"></p-skeleton></td>
            <td><p-skeleton width="8rem" height="1.5rem"></p-skeleton></td>
            <td><p-skeleton width="5rem" height="1.5rem"></p-skeleton></td>
          </tr>
          <ng-template #mostrarDatos>
            <tr>
                <td>{{entidad.id}}</td>
                <td>{{entidad.asignacion_vehiculo}}</td>
                <td>{{entidad.fecha | date: 'dd MMMM yyyy' : 'es' }}</td>
                <td style="text-align: center;">
                  <p-tag 
                    [severity]="entidad.completado ? 'success' : 'warn'" 
                    [value]="entidad.completado ? '' : ''"
                    [icon]="entidad.completado ? 'pi pi-check' : 'pi pi-clock'">
                  </p-tag>
                </td>
                <td>{{entidad.observacion}}</td>
                <td>
                  <p-button icon="pi pi-pencil" variant="text" severity="warn" class="mr-2" [raised]="true" (click)="CargarDatosModal(entidad)"></p-button>
                  <p-button icon="pi pi-trash" variant="text" severity="danger" [raised]="true" (click)="eliminar(entidad.id)"></p-button>
                </td>
            </tr>
          </ng-template>
        </ng-template>
    </p-table>  
</div>

<!-- Modal para agregar o editar producto -->
<p-dialog [(visible)]="displayModal" [style]="{  width: '90%', maxWidth: '450px'}" [modal]="true" header="Formulario">
    <ng-template #content>
        <div class="formulario">
            <div>
                <label for="fecha" class="block font-bold mb-3">Fecha</label>
                <p-datepicker id="fecha" [(ngModel)]="entidad.fecha" dateFormat="dd-MM-yy" placeholder="Fecha asignación" [showIcon]="true" [appendTo]="'body'" fluid />
            </div>
            <div>
                <label for="observacion" class="block font-bold mb-3">Observación</label>
                <textarea id="observacion" pTextarea [(ngModel)]="entidad.observacion" rows="3" cols="30" placeholder="Este campo es opcional" fluid ></textarea>
            </div>
        </div>
    </ng-template>
    <ng-template #footer>
      <p-button label="Cancel" severity="info" icon="pi pi-times" text (click)="cerrarDialogo()" />
      <p-button label="Guardar" severity="info" icon="pi pi-check" (click)="guardar()" />
    </ng-template>
</p-dialog>
